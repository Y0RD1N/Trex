[package]
name = "trex"
version = "0.5.0"
description = "trex — terminal con proyectos que lanzan Claude Code"
authors = ["trex"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
portable-pty = "0.9.0"
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Control remoto: servidor HTTP/WebSocket para la app móvil (apagado por defecto).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
getrandom = "0.3"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
# Modo llamada (apagado por defecto): detector de voz y Whisper locales.
# `shared`: las bibliotecas estáticas precompiladas usan el CRT estático y
# chocan con el dinámico de Rust. Los DLL se cargan bajo demanda (ver build.rs).
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
# Conversación en tiempo real con Gemini Live por WebSocket (ver voice_live.rs).
# Ya venían con axum y reqwest; aquí solo se usan directamente.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# La voz de trex se descarga como un paquete .tar.bz2 (ver voice.rs).
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
# Captura del micrófono con WASAPI en modo crudo (ver voice_capture.rs) y
# voz de respuesta con el sintetizador de Windows (ver voice_speech.rs).
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
