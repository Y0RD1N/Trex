[package]
name = "trex-agent"
version = "0.2.0"
edition = "2021"
description = "Standalone native API coding agent and JSON-RPC stdio server"
license = "MIT"

[[bin]]
name = "trex-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "=1.5.3"
diffy = "0.4"
dirs = "6"
fs2 = "0.4"
flate2 = "=1.1.10"
futures-util = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
ignore = "0.4"
httpdate = "1"
portable-pty = "=0.9.0"
rustyline = "17"
tempfile = "3"
enigo = "=0.6.1"
jpeg-decoder = { version = "=0.3.2", path = "vendor/jpeg-decoder", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops"] }
xcap = "=0.9.8"
# Motor de accesibilidad propio (UI Automation). Ya llega con xcap: misma versión.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
libc = "0.2"
zbus = {version="=5.19.0",default-features=false,features=["tokio"]}
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
x11rb = "=0.13.2"

[profile.release]
lto = "thin"
strip = true
