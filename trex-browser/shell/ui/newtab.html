<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva pestaña</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%}
body{display:grid;place-items:center;background:radial-gradient(70% 60% at 20% 10%,rgba(var(--accent-rgb),.16),transparent 60%),radial-gradient(60% 60% at 90% 90%,rgba(120,90,255,.12),transparent 60%),#121212;user-select:text}
main{width:min(640px,86vw);display:grid;gap:26px;justify-items:center;margin-top:-6vh}
.logo{font:700 34px var(--sans);letter-spacing:-.03em}.logo span{color:var(--accent)}
#hello{color:var(--muted);margin-top:-18px}
form{width:100%;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--edge);box-shadow:var(--hi),0 18px 50px rgba(0,0,0,.35)}
form:focus-within{border-color:rgba(var(--accent-rgb),.55);background:rgba(255,255,255,.08)}
form svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}
input{flex:1;min-width:0;font:15px var(--sans);color:var(--text);background:none;border:0;outline:0}
input::placeholder{color:var(--dim)}
form button{height:36px;padding:0 16px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:600 13px var(--sans);border:0}
.quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.quick button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--muted);font:500 12.5px var(--sans);cursor:pointer}
.quick button:hover{background:rgba(255,255,255,.09);color:var(--text)}
.quick code{font:12px var(--mono);color:var(--accent-text)}
.tips{color:var(--dim);font-size:12px;display:flex;gap:18px}
kbd{font:11px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--edge);color:var(--muted);background:rgba(255,255,255,.04)}
</style>
</head>
<body>
<main>
  <div class="logo">trex<span>.</span>browser</div>
  <div id="hello"></div>
  <form id="go"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" placeholder="Busca o escribe una dirección" spellcheck="false" autocomplete="off"><button>Ir</button></form>
  <div class="quick">
    <button data-url="http://localhost:3000"><code>:3000</code> localhost</button>
    <button data-url="http://localhost:5173"><code>:5173</code> Vite</button>
    <button data-url="http://localhost:8080"><code>:8080</code> localhost</button>
  </div>
  <div class="tips"><span><kbd>Ctrl</kbd> <kbd>T</kbd> nueva pestaña</span><span><kbd>Ctrl</kbd> <kbd>L</kbd> dirección</span><span><kbd>Ctrl</kbd> <kbd>⇧</kbd> <kbd>A</kbd> agentes</span><span>Acerca el cursor arriba para ver los controles</span></div>
</main>
<script src="newtab.js"></script>
</body>
</html>
