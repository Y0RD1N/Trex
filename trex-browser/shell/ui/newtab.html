<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva pestaña</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%}
/* Same voice as the app's first screen: left-aligned, a flat surface, the «t» mark. No gradients, no hero. */
body{background:var(--bg);user-select:text;overflow:auto}
main{width:min(680px,88vw);margin:0 auto;padding:max(48px,14vh) 0 48px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.mark{width:48px;height:48px;fill:var(--text);margin-bottom:14px;flex:none}
h1{font:500 22px/1.3 var(--sans);letter-spacing:-.01em}
#hello{color:var(--muted);font-size:14px;margin-top:-6px}
form{width:100%;display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;margin-top:14px;border-radius:12px;background:var(--surface);border:1px solid var(--edge-strong)}
form:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge-strong))}
form svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}
input{flex:1;min-width:0;font:15px var(--sans);color:var(--text);background:none;border:0;outline:0}
input::placeholder{color:var(--dim)}
form button{height:34px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:500 13px var(--sans);border:0;cursor:pointer}
form button:hover{background:color-mix(in srgb,var(--accent) 86%,white)}
.rule{align-self:stretch;display:flex;align-items:center;gap:12px;margin-top:16px;color:var(--dim);font:12px var(--mono)}
.rule::after{content:"";flex:1;border-top:1px solid var(--edge)}
.quick{align-self:stretch;display:grid;border-top:1px solid var(--edge)}
.quick button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;min-height:40px;text-align:left;padding:0 6px;border-bottom:1px solid var(--edge);color:var(--text);font:13px var(--mono);cursor:pointer}
.quick button:hover{background:var(--hover)}
.quick .n{color:var(--accent-text)}
.quick code{font:12px var(--mono);color:var(--dim)}
.tips{align-self:stretch;display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--dim);font-size:12px}
kbd{font:11px var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--edge-strong);color:var(--muted);background:var(--inset)}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="240 248 544 544" aria-label="trex" role="img"><path d="M432 248h120v104h200v112H552v160q0 56 56 56h128v112H592q-160 0-160-160V464H272V352h160Z"/></svg>
  <h1>Nueva pestaña</h1>
  <div id="hello"></div>
  <form id="go"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" placeholder="Busca o escribe una dirección" spellcheck="false" autocomplete="off"><button>Ir</button></form>
  <div class="rule"><span>Servidores locales</span></div>
  <div class="quick">
    <button data-url="http://localhost:3000"><span class="n">1</span><span>localhost</span><code>:3000</code></button>
    <button data-url="http://localhost:5173"><span class="n">2</span><span>Vite</span><code>:5173</code></button>
    <button data-url="http://localhost:8080"><span class="n">3</span><span>localhost</span><code>:8080</code></button>
  </div>
  <div class="tips"><span><kbd>Ctrl</kbd> <kbd>T</kbd> nueva pestaña</span><span><kbd>Ctrl</kbd> <kbd>L</kbd> dirección</span><span><kbd>Ctrl</kbd> <kbd>⇧</kbd> <kbd>A</kbd> agentes</span><span>Acerca el cursor arriba para ver los controles</span></div>
</main>
<script src="newtab.js"></script>
</body>
</html>
