<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-vars.css">
<style>
html,body{overflow:hidden}
#root{display:inline-block;padding:16px}  /* room for the shadow inside the view */
/* Floating over a page they cannot blur: solid surfaces with a soft shadow, like the app's menus. */
#root .glass{background:var(--elevated);border:1px solid var(--edge-strong);box-shadow:var(--pop-shadow)}

/* ---- Top bar (part=island): full-width view, bar centred inside ---- */
body[data-part=island] #root{display:block;padding:0}
.hot{height:12px}                                   /* collapsed: invisible reveal strip */
body.revealed #root{padding:10px 16px 18px}
/* The single grid column may not grow with its content: many tabs scroll inside the strip, they never widen the bar. */
.topbar{margin:0 auto;width:min(1180px,100%);border-radius:12px;padding:5px 6px 6px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
/* Only when the bar actually appears; re-renders (title, favicon, loading) must not replay it. */
.topbar.enter{animation:drop .16s cubic-bezier(.2,.8,.2,1)}
.topbar.out{animation:lift .16s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes lift{to{opacity:0;transform:translateY(-14px)}}
/* Tabs row: empty space drags the window, like any desktop browser */
.tabsrow{display:flex;align-items:center;gap:4px;height:34px;min-width:0;-webkit-app-region:drag}
.tabsrow>*{-webkit-app-region:no-drag}
.tabsrow>.dragspace{-webkit-app-region:drag;flex:1;min-width:24px;align-self:stretch}
.tabs{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabpill{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 9px;border-radius:8px;color:var(--muted);flex:0 1 200px;min-width:96px;max-width:220px;position:relative}
.tabpill:hover{background:var(--hover);color:var(--text)}
.tabpill.on{background:var(--selected);color:var(--text)}
.tabpill .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tabpill .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--dim);opacity:0;flex:none}
/* Owner of a tab (an agent): a small mono initial, no tinted tile. */
.tab-owner{width:17px;height:17px;flex:none;display:grid;place-items:center;border:1px solid var(--edge-strong);border-radius:5px;font:500 9px var(--mono);color:var(--muted)}
.tabpill.on .x,.tabpill:hover .x{opacity:1}
.tabpill .x:hover{background:var(--active);color:var(--text)}
.tabpill .x svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
/* Loading: the trex loader instead of a spinning arrow. */
.fav.loading{background:none;color:var(--accent);position:relative}
.fav.loading svg{display:none}
.fav.loading::before{content:"";width:14px;height:14px;background:currentColor;-webkit-mask:var(--loader-mask) center/contain no-repeat;mask:var(--loader-mask) center/contain no-repeat}
.newtab{flex:none}
/* Window controls */
.wc{display:flex;gap:2px;flex:none}
.wc button{width:34px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.wc button:hover{background:var(--active);color:var(--text)}
.wc button.danger:hover{background:var(--danger);color:#fff}
.wc svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.wc.mac{gap:7px;padding:0 8px 0 6px}
.wc.mac button{width:12px;height:12px;border-radius:50%;background:var(--edge-strong)}
.wc.mac button:hover{background:var(--c)}
/* Toolbar row */
.toolrow{display:flex;align-items:center;gap:6px;height:36px;padding:0 2px}
.sep{width:1px;height:20px;background:var(--edge);flex:none}
.url{display:flex;align-items:center;gap:8px;flex:1;min-width:160px;height:32px;padding:0 12px;border-radius:8px;background:var(--inset);border:1px solid transparent}
.url:hover{background:var(--bg-side)}
.url:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));background:var(--bg)}
.url svg{width:13px;height:13px;stroke:var(--ok);fill:none;stroke-width:2;flex:none}
.url svg.insecure{stroke:var(--dim)}
.url input{flex:1;min-width:0;font:12.5px var(--mono);color:var(--muted)}
.url input:focus{color:var(--text)}
.url input::placeholder{color:var(--dim)}
/* The agent chip: its strata core, name and state. Flat, outlined by state. */
.agentchip{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 8px;border-radius:8px;background:none;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--edge));flex:none}
.agentchip:hover{background:var(--hover)}
.agentchip.idle{border-color:var(--edge)}
.agentchip.paused{border-color:var(--warn-border)}
.agentchip small{color:var(--accent-text);font:500 11.5px var(--mono)}.agentchip.paused small{color:var(--warn)}.agentchip.idle small{color:var(--dim)}
.spin{display:inline-grid;width:16px;height:16px;background:currentColor;-webkit-mask:var(--loader-mask) center/contain no-repeat;mask:var(--loader-mask) center/contain no-repeat}
.spin svg{display:none}

/* Extra rows: find, permission notices, downloads */
.row{display:flex;align-items:center;gap:8px;min-height:36px;padding:2px 4px 2px 10px;margin-top:2px;border-top:1px solid var(--edge)}
.row>svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.findrow input{flex:1;min-width:0;height:28px;font:13px var(--sans)}
.findrow input::placeholder{color:var(--dim)}
.findrow .count{font:11.5px var(--mono);color:var(--muted);min-width:64px;text-align:right}
.findrow .count.none{color:var(--danger)}
/* A site asks for permission: amber, like the permission cards in the app chat. */
.notice{background:var(--warn-bg);border-radius:10px;border:1px solid var(--warn-border);margin-top:6px;padding:6px 6px 6px 12px}
.notice>svg{stroke:var(--warn)}
.notice .msg{flex:1;color:var(--muted);white-space:normal}.notice .msg b{color:var(--text);font-weight:600}
.zoom{height:22px;padding:0 8px;border-radius:6px;background:var(--active);font:500 11px var(--mono);color:var(--text);flex:none}
.zoom:hover{background:var(--selected)}
.ib.dl.busy{color:var(--accent)}
.panelhead{justify-content:space-between;padding-right:10px}
.link{color:var(--accent-text);font-size:12px}.link:hover{text-decoration:underline}
.dllist{display:grid;gap:2px;max-height:260px;overflow:auto;padding:2px 2px 4px}
.dlitem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.dlitem:hover{background:var(--hover)}
.dlicon{width:28px;height:28px;display:grid;place-items:center;flex:none}
.dlicon svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.dlitem.completed .dlicon svg{stroke:var(--ok)}
.dlitem.cancelled,.dlitem.interrupted{opacity:.6}
.dlmeta{flex:1;min-width:0;display:grid;gap:3px}
.dlmeta strong{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.dlmeta small{color:var(--dim);font-size:11.5px}
.bar{height:4px;border-radius:2px;background:var(--active);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s}
.bar i.indet{animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ---- Agent cursor (part=cursor): tip at (4,4) of the view ---- */
body[data-part=cursor] #root{padding:0}
.agentcursor{position:relative;width:220px;height:44px;pointer-events:none}
.agentcursor svg{position:absolute;left:0;top:0;width:24px;height:24px;fill:var(--accent);stroke:var(--bg-side);stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.agentcursor span{position:absolute;left:20px;top:20px;max-width:190px;overflow:hidden;text-overflow:ellipsis;background:var(--accent);color:var(--accent-ink);font:500 11px var(--mono);padding:3px 8px;border-radius:7px 7px 7px 2px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.agentchip{max-width:340px;min-width:0}
.agentchip .name{min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.agentchip small{flex:none}
.agentchip .model{font-style:normal;color:var(--dim);font-size:11.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis}

/* ---- Dock ---- */
.dock{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:12px}
.dock .msg{color:var(--muted)}.dock .msg b{color:var(--text);font-weight:500}
.dock code{font:12px var(--mono);color:var(--accent-text)}
.dock .err{max-width:300px;overflow:hidden;text-overflow:ellipsis;color:var(--danger);font-size:12px}
.dock .btn:disabled{opacity:.55}
/* Paused: the same loader, still and amber. */
.dock.paused .pulse{background:var(--warn);-webkit-mask-image:var(--loader-mask-still);mask-image:var(--loader-mask-still)}
</style>
</head>
<body><div id="root"></div><script type="module" src="overlay.js"></script></body>
</html>
